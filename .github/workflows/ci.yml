name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    # Swift 6.2 rather than the 6.0 the other libraries pin, because
    # NerdzInjectTesting uses Swift Testing's TestScoping, added in 6.1.
    container: swift:6.2-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show environment
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build with complete strict concurrency
        run: swift build --build-tests -Xswiftc -strict-concurrency=complete
